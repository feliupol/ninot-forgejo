[package]
name = "ninot-forgejo"
version = "2026.45.0"
edition = "2024"
rust-version = "1.88"
description = "In-memory fake of the Forgejo REST API and git hosting for end-to-end tests"
license = "MIT"
repository = "https://github.com/feliupol/ninot-forgejo"
readme = "README.md"
keywords = ["forgejo", "fake", "mock", "testing", "git"]
categories = ["development-tools::testing"]
include = ["/src/**", "/tests/**", "/spec/**", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[lib]
name = "ninot_forgejo"

[[bin]]
name = "ninot-forgejo"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
clap = { version = "4", features = ["derive"] }
headers = "0.4"
hex = "0.4"
hmac = "0.13.0"
http = "1"
ninot-common = { version = "2026.45.2", features = ["git", "server", "tls", "profile"] }
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
url = "2"
uuid = "1"
winnow = "0.7"

[build-dependencies]
ninot-common = { version = "2026.45.2", features = ["build"] }
prettyplease = "0.2"
proc-macro2 = "1"
schemars = "0.8.22"
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
typify = { version = "0.8", default-features = false }

[dev-dependencies]
hmac = "0.13.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"
sha2 = "0.11.0"
