[package]
name = "ninot-forgejo-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Python fixture bindings for ninot-forgejo"
license = "MIT"
publish = false

[lib]
name = "ninot_forgejo"
crate-type = ["cdylib"]

[dependencies]
ninot-forgejo = { path = ".." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
